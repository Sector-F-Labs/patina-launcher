[package]
name = "patina-launcher"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The Patina desktop's app launcher: installed apps from .desktop files and folder apps in ~/Apps, with search"
repository = "https://github.com/Sector-F-Labs/patina-desktop"

[dependencies]
egui = "0.35"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
libc = "0.2"
patina-apps = { git = "ssh://divan@remotes.divanv.com/~/Remotes/src/com/sectorflabs/patina-apps", features = ["icon"] }
patina-shell = { path = "../shell" }
patina-ui = { workspace = true }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
